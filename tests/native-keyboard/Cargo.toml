[package]
name = "gpui-rhai-native-keyboard-tests"
version = "0.0.0"
edition = "2024"
publish = false
# One test binary for the native tests (tests/native/main.rs); see the [[test]] targets below.
autotests = false

[workspace]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11", default-features = false, features = ["font-kit", "test-support"], optional = true }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", default-features = false, features = ["font-kit", "runtime_shaders", "wayland", "x11", "test-support"], optional = true }
gpui-fast = { package = "gpui-fast", version = "=0.1.13", default-features = false, features = ["font-kit", "wayland", "x11", "test-support"], optional = true }
gpui-fast-platform = { package = "gpui-fast-platform", version = "=0.1.13", default-features = false, features = ["font-kit", "runtime_shaders", "wayland", "x11", "test-support"], optional = true }
gpui-rhai = { path = "../../crates/gpui-rhai", default-features = false, features = ["charts"] }
gpui-rhai-cli = { path = "../../crates/gpui-rhai-cli", default-features = false, features = ["test-support"] }
gpui-rhai-registry = { path = "../../registry" }
image = { version = "0.25", default-features = false, features = ["png"] }
semver = "1"
serde_json = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

[features]
default = ["gpui-pre"]
gpui-pre = ["dep:gpui", "dep:gpui_platform", "gpui-rhai/gpui-pre", "gpui-rhai-cli/gpui-pre"]
gpui-fast = ["dep:gpui-fast", "dep:gpui-fast-platform", "gpui-rhai/gpui-fast", "gpui-rhai-cli/gpui-fast"]
# Mounted hot-reload tests: `cargo test --features dev-reload --test token_reload`.
dev-reload = ["gpui-rhai/dev-reload"]

[[test]]
name = "native"
path = "tests/native/main.rs"

[[test]]
name = "token_reload"
path = "tests/token_reload.rs"
required-features = ["dev-reload"]

# End-to-end benchmarks, all `#[ignore]`d: run them with `scripts/benchmark.sh`.
[[test]]
name = "benchmark"
path = "tests/benchmark.rs"

# Capture and profiling tools, run with `cargo run --bin <name>`; they hold no tests.
[[bin]]
name = "gallery_baselines"
path = "src/bin/gallery_baselines.rs"
test = false

[[bin]]
name = "example_baselines"
path = "src/bin/example_baselines.rs"
test = false

[[bin]]
name = "gallery_profile"
path = "src/bin/gallery_profile.rs"
test = false

[[bin]]
name = "theme_appearance_probe"
path = "src/bin/theme_appearance_probe.rs"
test = false

[[bin]]
name = "theme_appearance_lifecycle"
path = "src/bin/theme_appearance_lifecycle.rs"
test = false

# As in the main workspace: unoptimized Rhai frames are large, and stories that render every
# official component come close to a 2MB test-thread stack in debug builds.
[profile.dev.package.rhai]
opt-level = 1
