[package]
name = "gpui-rhai-native-keyboard-tests"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.6", default-features = false, features = ["font-kit", "test-support"] }
gpui-rhai = { path = "../../crates/gpui-rhai", features = ["charts"] }
gpui-rhai-cli = { path = "../../crates/gpui-rhai-cli" }
gpui-rhai-registry = { path = "../../registry" }
semver = "1"
serde_json = "1"
