[package]
name = "gpui-rhai"
description = "A Rhai-authored declarative UI runtime for GPUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/gpui-rhai"
keywords = ["gpui", "rhai", "gui", "desktop", "declarative"]
categories = ["gui"]
include = ["src/**/*.rs", "README.md", "LICENSE-*", "Cargo.toml"]

[features]
default = []
charts = []
dev-reload = ["dep:notify"]
grain-backend = ["rhai/grain"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
notify = { workspace = true, optional = true }
rhai.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
thiserror.workspace = true
toml.workspace = true
unicode-segmentation.workspace = true
image.workspace = true
jiff.workspace = true
usvg.workspace = true
resvg.workspace = true
roxmltree.workspace = true
event-listener.workspace = true
similar.workspace = true
syntect.workspace = true
regex.workspace = true

[dev-dependencies]
tempfile = "3"

[[example]]
name = "performance_probe"
path = "examples/internal/performance/performance_probe.rs"

[[example]]
name = "table_1000"
path = "examples/internal/performance/table_1000.rs"

[[example]]
name = "native_overlay_smoke"
path = "examples/internal/smoke/native_overlay_smoke.rs"

[[example]]
name = "native_virtual_list_smoke"
path = "examples/internal/smoke/native_virtual_list_smoke.rs"

[[example]]
name = "phase0_probe"
path = "examples/internal/smoke/phase0_probe.rs"

[lints]
workspace = true
