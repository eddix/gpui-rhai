[package]
name = "rhai-jit-experiment"
description = "A narrow Grain-to-native JIT experiment for gpui-rhai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false
readme = "README.md"

[features]
default = []
gpui-adapter = ["dep:gpui-rhai"]

[dependencies]
dynasmrt.workspace = true
gpui-rhai = { path = "../gpui-rhai", features = ["experimental-backend"], optional = true }
rhai = { workspace = true, features = ["grain"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[[test]]
name = "gpui_backend"
required-features = ["gpui-adapter"]

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
