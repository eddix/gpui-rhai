name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, for the latest stable toolchain (the `stable` job below).
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # portable, native and release split the Linux checks into three parallel
  # jobs; they share the setup below through YAML anchors.
  portable:
    # The schedule only exists for the `stable` job; main was checked on push.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # A normal run takes under 10 minutes; the margin covers a cold compiler
    # cache together with a slow apt mirror.
    timeout-minutes: 60
    env: &cargo-env
      # Incremental caches only cost disk on a one-shot runner, and sccache
      # cannot cache incremental builds.
      CARGO_INCREMENTAL: 0
      # Line tables keep file:line in panics and backtraces at a fraction of
      # full debug info's compile, link and disk cost.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # Compiled library crates live in the Actions cache, not on the runner's
      # disk. Pull requests read the entries main's runs wrote.
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      # Native sharding can run for longer than the daemon's idle limit
      # before Cargo starts another target in the same job.
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: clippy,rustfmt
      - &sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true
      - &linux-test-deps
        name: Install native Linux test dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libxcb1-dev
            libfontconfig1-dev
            libvulkan1
            libwayland-dev
            libx11-xcb-dev
            libxkbcommon-dev
            libxkbcommon-x11-dev
            mesa-vulkan-drivers
            weston
            xvfb
      - &select-rust-cache
        name: Use compiler cache when available
        run: |
          if sccache "$(rustup which rustc)" -vV >/dev/null; then
            echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"
          else
            echo '::warning::Compiler cache is unavailable; compiling directly.'
          fi
      - name: Reject gpui-component dependencies
        run: |
          if cargo tree --workspace | grep -q 'gpui-component'; then
            echo 'gpui-component must not appear in the dependency graph'
            exit 1
          fi
      - name: Keep GPUI test-support out of default and release builds
        run: bash scripts/check-test-support.sh
      - name: Format
        run: cargo fmt --all -- --check
      # Every feature but the opt-in Grain backend, which the `stable` job
      # checks, and `offscreen-pre`, which the `native` job checks with GPUI's
      # test-support; leaving them out lets the default-feature run below
      # reuse Rhai and GPUI.
      - name: Clippy (MSRV)
        run: cargo clippy --workspace --all-targets --features gpui-rhai/charts,gpui-rhai/dev-reload -- -D warnings
      # Libraries, binaries and integration tests; examples are compiled by
      # Clippy above, their tests run in crates/gpui-rhai/tests/examples.rs, and
      # the release job links the ones CI launches.
      - name: Test
        run: cargo test --workspace --lib --bins --tests --features gpui-rhai/charts,gpui-rhai/dev-reload
      - name: Default feature contract
        run: cargo test -p gpui-rhai --lib --locked
      # A registry change updates the reference applications' installed copies
      # in the same pull request (apps/README.md).
      - name: Reference application components and check
        run: bash scripts/check-app-components.sh
      - name: Public documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc -p gpui-rhai --features charts,dev-reload --no-deps
          cargo doc -p gpui-rhai-cli --lib --no-deps
      - name: Package crates
        run: |
          cargo package -p gpui-rhai
          cargo package -p gpui-rhai-registry
          # Full verification becomes possible after the two dependencies enter
          # the crates.io index; workspace checks validate their local graph.
          cargo package -p gpui-rhai-cli --no-verify \
            --config 'patch.crates-io.gpui-rhai.path="crates/gpui-rhai"' \
            --config 'patch.crates-io.gpui-rhai-registry.path="registry"'

  # GPUI's test-support window against the official components.
  native:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [standard, aggressive]
        shard: [0, 1]
    env: *cargo-env
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: clippy
      - *sccache
      - *linux-test-deps
      - *select-rust-cache
      # `gpui_rhai::offscreen`, for an application's examples/shot.rs. Its
      # renderer is macOS-only; Linux checks the rest.
      - name: Offscreen feature
        if: matrix.mode == 'standard' && matrix.shard == 0
        run: |
          cargo clippy -p gpui-rhai --all-targets --locked --features offscreen-pre -- -D warnings
          cargo test -p gpui-rhai --lib --locked --features offscreen-pre offscreen
      - name: Native keyboard test support
        if: matrix.mode == 'standard'
        run: |
          if [ "${{ matrix.shard }}" = "0" ]; then
            cargo test --manifest-path tests/native-keyboard/Cargo.toml --locked
          else
            cargo test --manifest-path tests/native-keyboard/Cargo.toml --locked --test native
          fi
        env:
          # Large Gallery compile/mount matrices are CPU-bound in unoptimized
          # builds. Keep debug assertions while making the native suite tractable.
          CARGO_PROFILE_TEST_OPT_LEVEL: "1"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: node ${{ github.workspace }}/scripts/native-test-shard.mjs
          GPUI_RHAI_NATIVE_SHARD: ${{ matrix.shard }}
          GPUI_RHAI_NATIVE_SHARDS: "2"
      # Every subtree of one node or more becomes a cache island, every view
      # anchors its width and a cached render that lays out differently
      # panics, so each native test also tests the islands.
      - name: Native tests over cache islands
        if: matrix.mode == 'aggressive'
        run: cargo test --manifest-path tests/native-keyboard/Cargo.toml --locked --test native
        env:
          GPUI_RHAI_RENDER_ISLANDS: aggressive
          CARGO_PROFILE_TEST_OPT_LEVEL: "1"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: node ${{ github.workspace }}/scripts/native-test-shard.mjs
          GPUI_RHAI_NATIVE_SHARD: ${{ matrix.shard }}
          GPUI_RHAI_NATIVE_SHARDS: "2"
      - name: Mounted hot reload
        if: matrix.mode == 'standard' && matrix.shard == 0
        run: cargo test --manifest-path tests/native-keyboard/Cargo.toml --locked --features dev-reload --test token_reload
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: "1"

  # The gpui-fast backend (gpui-rhai's `gpui-fast` feature, instead of the
  # default gpui-pre). Its scroll layers composite list rows without rendering
  # them, which gpui-rhai's virtual lists do not follow, so hosts run it with
  # GPUI_SCROLL_LAYERS=0 and so does the native suite; cache islands are off on
  # this backend and their tests do not run.
  fast:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env: *cargo-env
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: clippy
      - *sccache
      - *linux-test-deps
      - *select-rust-cache
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets --no-default-features --features gpui-rhai/gpui-fast,gpui-rhai/charts,gpui-rhai/dev-reload -- -D warnings
          cargo clippy -p gpui-rhai --all-targets --locked --no-default-features --features offscreen-fast -- -D warnings
      - name: Test
        run: cargo test --workspace --lib --bins --tests --no-default-features --features gpui-rhai/gpui-fast,gpui-rhai/charts,gpui-rhai/dev-reload

  fast-native:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env: *cargo-env
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - *sccache
      - *linux-test-deps
      - *select-rust-cache
      - name: Native tests
        run: cargo test --manifest-path tests/native-keyboard/Cargo.toml --locked --no-default-features --features gpui-fast --test native
        env:
          GPUI_SCROLL_LAYERS: "0"
          CARGO_PROFILE_TEST_OPT_LEVEL: "1"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: node ${{ github.workspace }}/scripts/native-test-shard.mjs
          GPUI_RHAI_NATIVE_SHARD: ${{ matrix.shard }}
          GPUI_RHAI_NATIVE_SHARDS: "2"

  release:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env: *cargo-env
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - *sccache
      - *linux-test-deps
      - *select-rust-cache
      - name: Release build
        run: |
          # The examples CI launches: the Linux window smoke and the artifact audit.
          examples="phase0_probe $(bash scripts/audit-release-artifacts.sh --list)"
          cargo build --release -p gpui-rhai $(printf -- '--example %s ' ${examples})
          cargo build --release -p gpui-rhai-cli
      - name: Linux X11 and Wayland window smoke
        run: bash scripts/linux-window-smoke.sh
      - name: Audit release artifacts
        run: bash scripts/audit-release-artifacts.sh
      # macOS launch, Metal, screenshot and unlocked-input gates run locally on a
      # Mac; see docs/release-checklist.md.

  # The reference applications (apps/README.md): a separate workspace built
  # against this checkout. Their macOS renderer harnesses are local gates.
  apps:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env: *cargo-env
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: clippy,rustfmt
      - *sccache
      - name: Install native Linux build dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libxcb1-dev
            libfontconfig1-dev
            libwayland-dev
            libx11-xcb-dev
            libxkbcommon-dev
            libxkbcommon-x11-dev
      - *select-rust-cache
      - name: Format
        run: cargo fmt --manifest-path apps/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path apps/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path apps/Cargo.toml --locked

  # Native extensions are opt-in; the public jobs above use released GPUI.
  vendor:
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        backend: [pre, fast]
        shard: [0, 1]
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      GPUI_SCROLL_LAYERS: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - name: Check the vendor graph
        if: matrix.shard == 0
        run: |
          bash scripts/with-vendor-gpui.sh sdk ${{ matrix.backend }} tree -p gpui-rhai --depth 1
          bash scripts/with-vendor-gpui.sh sdk ${{ matrix.backend }} check -p gpui-rhai-cli
      - name: Native and Gallery contracts on the vendor backend
        run: bash scripts/with-vendor-gpui.sh native ${{ matrix.backend }} test --test native
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: "1"
          CARGO_TARGET_AARCH64_APPLE_DARWIN_RUNNER: node ${{ github.workspace }}/scripts/native-test-shard.mjs
          GPUI_RHAI_NATIVE_SHARD: ${{ matrix.shard }}
          GPUI_RHAI_NATIVE_SHARDS: "2"
      - name: Check the repository app under vendor Pre
        if: matrix.backend == 'pre' && matrix.shard == 0
        run: bash scripts/with-vendor-gpui.sh apps pre test

  # The latest stable toolchain and the opt-in Grain backend. A new stable
  # release can break them without any change here, so they also run weekly.
  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml pins the MSRV, so the steps name `+stable`.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install native Linux build dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libxcb1-dev
            libfontconfig1-dev
            libwayland-dev
            libx11-xcb-dev
            libxkbcommon-dev
            libxkbcommon-x11-dev
      # The two GPUI backends exclude each other; the gpui-fast job checks the other one.
      - name: Latest stable check
        run: cargo +stable check --workspace --all-targets --features gpui-rhai/charts,gpui-rhai/dev-reload,gpui-rhai/grain-backend
      - name: Grain backend
        run: cargo +stable clippy -p gpui-rhai --all-targets --features grain-backend -- -D warnings

  # The one required check of branch protection: it fails when any job above
  # failed or was cancelled, so jobs can be added or renamed here without
  # changing the repository settings. A job skipped by its own `if` passes.
  ci-ok:
    if: always()
    needs: [portable, native, fast, fast-native, release, apps, stable, vendor]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "${NEEDS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "${NEEDS}" | jq -e 'any(.[]; .result != "success" and .result != "skipped")' >/dev/null; then
            exit 1
          fi
