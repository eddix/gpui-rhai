name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, for the latest stable toolchain (the `stable` job below).
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable:
    # The schedule only exists for the `stable` job; main was checked on push.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Incremental caches only cost disk on a one-shot runner.
      CARGO_INCREMENTAL: 0
      # Line tables keep file:line in panics and backtraces at a fraction of
      # full debug info's compile, link and disk cost.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5
      - name: Free runner disk
        # The debug workspace, the native test workspace and the release build
        # outgrew the runner's free space; SDKs this job never uses go first.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Install native Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libxcb1-dev \
            libfontconfig1-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            mesa-vulkan-drivers \
            weston \
            xvfb
      - name: Reject gpui-component dependencies
        run: |
          if cargo tree --workspace | grep -q 'gpui-component'; then
            echo 'gpui-component must not appear in the dependency graph'
            exit 1
          fi
      - name: Format
        run: cargo fmt --all -- --check
      # Every feature but the opt-in Grain backend, which the `stable` job
      # checks; leaving it out lets the default-feature run below reuse Rhai.
      - name: Clippy (MSRV)
        run: cargo clippy --workspace --all-targets --features gpui-rhai/charts,gpui-rhai/dev-reload -- -D warnings
      # Libraries, binaries and integration tests; examples are compiled by
      # Clippy above, their tests run in crates/gpui-rhai/tests/examples.rs, and
      # the release build below links the ones CI launches.
      - name: Test
        run: cargo test --workspace --lib --bins --tests --features gpui-rhai/charts,gpui-rhai/dev-reload
      - name: Default feature contract
        run: cargo test -p gpui-rhai --lib --locked
      - name: Native keyboard test support
        run: cargo test --manifest-path tests/native-keyboard/Cargo.toml --locked
      - name: Mounted hot reload
        run: cargo test --manifest-path tests/native-keyboard/Cargo.toml --locked --features dev-reload --test token_reload
      - name: Audit visual baselines
        run: bash scripts/audit-visual-baselines.sh
      - name: Public documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc -p gpui-rhai --all-features --no-deps
          cargo doc -p gpui-rhai-cli --lib --no-deps
      - name: Package crates
        run: |
          cargo package -p gpui-rhai
          cargo package -p gpui-rhai-registry
          # Full verification becomes possible after the two dependencies enter
          # the crates.io index; workspace checks validate their local graph.
          cargo package -p gpui-rhai-cli --no-verify \
            --config 'patch.crates-io.gpui-rhai.path="crates/gpui-rhai"' \
            --config 'patch.crates-io.gpui-rhai-registry.path="registry"'
      - name: Release build
        run: |
          # How much the debug builds took, for the runner's disk budget.
          du -sh target/debug tests/native-keyboard/target || true
          df -h /
          # The debug builds are done; their artifacts would crowd the release build.
          rm -rf target/debug tests/native-keyboard/target
          # The examples CI launches: the Linux window smoke and the artifact audit.
          examples="phase0_probe $(bash scripts/audit-release-artifacts.sh --list)"
          cargo build --release -p gpui-rhai $(printf -- '--example %s ' ${examples})
          cargo build --release -p gpui-rhai-cli
      - name: Linux X11 and Wayland window smoke
        run: bash scripts/linux-window-smoke.sh
      - name: Audit release artifacts
        run: bash scripts/audit-release-artifacts.sh
      # macOS launch, Metal, screenshot and unlocked-input gates run locally on a
      # Mac; see docs/release-checklist.md.

  # The latest stable toolchain and the opt-in Grain backend change without a
  # pull request touching them, so they run on main and weekly, not per PR.
  stable:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml pins the MSRV, so the steps name `+stable`.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install native Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libxcb1-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev
      - name: Latest stable check
        run: cargo +stable check --workspace --all-targets --all-features
      - name: Grain backend
        run: cargo +stable clippy -p gpui-rhai --all-targets --features grain-backend -- -D warnings
