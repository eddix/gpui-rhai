name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: clippy,rustfmt
      - name: Reject gpui-component dependencies
        run: |
          if cargo tree --workspace | grep -q 'gpui-component'; then
            echo 'gpui-component must not appear in the dependency graph'
            exit 1
          fi
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check (MSRV)
        run: cargo check --workspace --all-targets --all-features
      - name: Latest stable check
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          cargo +stable check --workspace --all-targets --all-features
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --all-features
      - name: Default runtime tests
        run: cargo test -p gpui-rhai --no-default-features --locked
      - name: Native keyboard test support
        run: cargo test --manifest-path tests/native-keyboard/Cargo.toml --locked
      - name: Audit visual baselines
        run: bash scripts/audit-visual-baselines.sh
      - name: Public documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc -p gpui-rhai --all-features --no-deps
          cargo doc -p gpui-rhai-cli --lib --no-deps
      # Package verification runs outside the workspace Git patch, so every
      # advertised feature must compile against official crates.io Rhai.
      - name: Package runtime crate (all features, official Rhai)
        run: cargo package -p gpui-rhai --locked --all-features
      - name: Release build
        run: |
          cargo build --release -p gpui-rhai --examples
          cargo build --release -p gpui-rhai-cli
      - name: Audit release artifacts
        run: bash scripts/audit-release-artifacts.sh
      # macOS launch, Metal, screenshot and unlocked-input gates run locally.
      # Private-repository GitHub-hosted macOS minutes require paid usage after
      # the account's included quota, while this portable job stays within the
      # standard Linux allowance.
