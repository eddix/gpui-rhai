[workspace]
members = [
    "crates/gpui-rhai",
    "crates/gpui-rhai-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["GPUI Rhai contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/eddix/gpui-rhai"

[workspace.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
notify = "8.2.0"
rhai = { version = "=1.26.0", features = ["internals", "metadata", "serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
thiserror = "2"
toml = "0.8"
toml_edit = "0.22"
unicode-segmentation = "1.13.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
jiff = { version = "0.2.35", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
